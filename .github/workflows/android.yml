name: Android

on:
  # No pull_request trigger: push already covers every branch, and having both
  # builds each PR twice for nothing.
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on tags

    # Secrets are hoisted to job level because the `secrets` context is NOT
    # available in a step-level `if`, while `env` is. A step's own `env` is also out
    # of scope for its own `if`, so this is the one placement that works.
    env:
      MIRAGE_KEYSTORE_B64: ${{ secrets.MIRAGE_KEYSTORE_B64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build web bundle
        run: npx vite build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # Explicit rather than trusting AGP to auto-download: pinning the platform and
      # build-tools keeps CI matching the local build, and makes a missing component
      # a clear failure here instead of a confusing one inside Gradle.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sync Capacitor
        run: npx cap sync android

      # The keystore lives only in secrets. Absent (e.g. on a fork PR) the release
      # build would be unsigned and uninstallable, so we fall back to a debug APK,
      # which Android signs with its own well-known key.
      - name: Decode keystore
        id: keystore
        if: env.MIRAGE_KEYSTORE_B64 != ''
        run: |
          echo "$MIRAGE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mirage.keystore"
          echo "path=$RUNNER_TEMP/mirage.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          MIRAGE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MIRAGE_KEYSTORE_PASSWORD: ${{ secrets.MIRAGE_KEYSTORE_PASSWORD }}
          MIRAGE_KEY_ALIAS: ${{ secrets.MIRAGE_KEY_ALIAS }}
          MIRAGE_KEY_PASSWORD: ${{ secrets.MIRAGE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (unsigned release not installable)
        if: steps.keystore.outputs.path == ''
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect and verify APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p out

          # Pick by variant rather than globbing, so the result cannot depend on
          # directory ordering if both variants are ever present.
          if [ -n "${{ steps.keystore.outputs.path }}" ]; then
            apk=android/app/build/outputs/apk/release/app-release.apk
          else
            apk=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          if [ ! -f "$apk" ]; then
            echo "expected APK not found at $apk" >&2
            exit 1
          fi

          # Same check that gates the local build: never publish something unsigned.
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk"

          name="mirage-${GITHUB_REF_NAME//\//-}.apk"
          cp "$apk" "out/$name"
          echo "path=out/$name" >> "$GITHUB_OUTPUT"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: mirage-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
