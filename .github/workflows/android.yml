name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on tags

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build web bundle
        run: npx vite build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sync Capacitor
        run: npx cap sync android

      # The keystore lives only in secrets. Absent (e.g. on a fork PR) the release
      # build would be unsigned and uninstallable, so we fall back to a debug APK,
      # which Android signs with its own well-known key.
      - name: Decode keystore
        id: keystore
        if: ${{ secrets.MIRAGE_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.MIRAGE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mirage.keystore"
          echo "path=$RUNNER_TEMP/mirage.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          MIRAGE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MIRAGE_KEYSTORE_PASSWORD: ${{ secrets.MIRAGE_KEYSTORE_PASSWORD }}
          MIRAGE_KEY_ALIAS: ${{ secrets.MIRAGE_KEY_ALIAS }}
          MIRAGE_KEY_PASSWORD: ${{ secrets.MIRAGE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (unsigned release not installable)
        if: steps.keystore.outputs.path == ''
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          # Whichever variant ran above.
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "no APK produced" >&2
            exit 1
          fi
          cp "$apk" "out/mirage-${GITHUB_REF_NAME//\//-}.apk"
          echo "path=out/mirage-${GITHUB_REF_NAME//\//-}.apk" >> "$GITHUB_OUTPUT"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: mirage-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
